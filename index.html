<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15132a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Khmer Cover AI — Personal Studio</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Khmer',sans-serif;background:#111024;color:#f8f6ff;margin:0}main{max-width:650px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px}h2{font-size:19px}section{background:#22203a;padding:18px;border-radius:18px;margin:17px 0}button,select,input[type=file]{font:inherit}button,select{background:#7555ed;color:white;border:0;border-radius:12px;padding:12px;margin:5px 3px 5px 0}button:disabled{opacity:.45}audio{width:100%;margin:10px 0}label{display:block;margin:12px 0}input[type=range]{width:100%}.muted{color:#bcb6d2;font-size:13px}.notice{background:#39304b;padding:12px;border-radius:10px}a{color:#cbbcff}</style></head><body><main><header><h1>🎤 Khmer Cover AI</h1><button id="lang">English</button></header><p id="intro"></p><section><h2 id="musicTitle"></h2><input id="music" type="file" accept="audio/*"><audio id="musicPlayer" controls></audio></section><section><h2 id="recordTitle"></h2><button id="start"></button><button id="stop" disabled></button><audio id="voicePlayer" controls></audio><p class="muted" id="micNote"></p></section><section><h2 id="mixTitle"></h2><label><span id="musicVolumeLabel"></span><input id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.7"></label><label><span id="voiceVolumeLabel"></span><input id="voiceVolume" type="range" min="0" max="2" step="0.05" value="1"></label><label><span id="echoLabel"></span><input id="echo" type="range" min="0" max="0.6" step="0.05" value="0.15"></label><button id="preview"></button><button id="endPreview"></button><button id="export"></button><p class="muted" id="mixNote"></p></section><section><h2 id="presetTitle"></h2><select id="voicePreset"><option value="1">Original</option><option value="0.84">Male style (lower pitch)</option><option value="1.18">Female style (higher pitch)</option></select><p id="presetNote"></p></section><section><h2 id="aiTitle"></h2><p class="notice" id="aiNote"></p></section><p class="muted" id="privacy"></p></main><script>
const T={km:{intro:'ស្ទូឌីយោផ្ទាល់ខ្លួន ឥតគិតថ្លៃ សម្រាប់ iPhone',musicTitle:'🎵 ជ្រើសរើសភ្លេង',recordTitle:'🎙️ ថតសំឡេង',start:'ចាប់ផ្តើមថត',stop:'បញ្ឈប់ថត',micNote:'សូមអនុញ្ញាត Microphone ក្នុង Safari។ ប្រើកាសពេលថត ដើម្បីកុំឱ្យសំឡេងភ្លេងចូលមីក្រូហ្វូន។',mixTitle:'🎚️ លាយសំឡេង',musicVolumeLabel:'កម្រិតសំឡេងភ្លេង',voiceVolumeLabel:'កម្រិតសំឡេងច្រៀង',echoLabel:'Echo សំឡេងច្រៀង',preview:'ស្តាប់លទ្ធផល',endPreview:'បញ្ឈប់ស្តាប់',export:'រក្សាទុក WAV',mixNote:'សម្រាប់លទ្ធផលល្អ សូមថតសំឡេងច្រៀងជាមួយភ្លេងដែលចាប់ផ្តើមពីវិនាទី 0។',presetTitle:'🎤 បែបសំឡេងប្រុស / ស្រី',presetNote:'នេះជា Pitch Effect មិនមែន AI Cover ពិតប្រាកដទេ។ វាប្តូរល្បឿនសំឡេងផងដែរ។',aiTitle:'🤖 មុខងារ AI',aiNote:'AI Voice Conversion និង Vocal Removal មិនទាន់មាននៅក្នុង Version ឥតគិតថ្លៃនេះទេ។',privacy:'ឯកសារនិងសំឡេងត្រូវបានដំណើរការក្នុង Browser របស់អ្នក មិនត្រូវបាន Upload ទៅ Server ដោយ App នេះទេ។',need:'សូមជ្រើសរើសភ្លេង និងថតសំឡេងជាមុន',failed:'មិនអាចដំណើរការឯកសារសំឡេងនេះបានទេ',ready:'ឯកសារ WAV រួចរាល់។ ប្រើ Share → Save to Files បើចាំបាច់។'},en:{intro:'Free personal music studio for iPhone',musicTitle:'🎵 Choose instrumental',recordTitle:'🎙️ Record vocals',start:'Start recording',stop:'Stop recording',micNote:'Allow microphone access in Safari. Wear headphones while recording to avoid music bleeding into your microphone.',mixTitle:'🎚️ Mix audio',musicVolumeLabel:'Music volume',voiceVolumeLabel:'Vocal volume',echoLabel:'Vocal echo',preview:'Preview mix',endPreview:'Stop preview',export:'Save WAV',mixNote:'For best synchronization, sing along with music starting at second 0.',presetTitle:'🎤 Male / Female voice effect',presetNote:'Pitch effect only, not AI voice conversion. Playback timing also changes.',aiTitle:'🤖 AI features',aiNote:'AI voice conversion and vocal removal are not included in this free offline version yet.',privacy:'Your audio is processed locally in the browser and is not uploaded to a server by this app.',need:'Please choose music and record vocals first',failed:'Could not process this audio file',ready:'WAV ready. Use Share → Save to Files if needed.'}};
let locale='km',musicFile=null,voiceBlob=null,recorder=null,stream=null,chunks=[],ctx=null,playing=[];const $=id=>document.getElementById(id);function translate(){document.documentElement.lang=locale;for(const k of Object.keys(T[locale]))if($(k))$(k).textContent=T[locale][k];$('lang').textContent=locale==='km'?'English':'ខ្មែរ';}translate();$('lang').onclick=()=>{locale=locale==='km'?'en':'km';translate()};$('music').onchange=e=>{musicFile=e.target.files[0];if(musicFile)$('musicPlayer').src=URL.createObjectURL(musicFile)};
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const opts=MediaRecorder.isTypeSupported('audio/mp4')?{mimeType:'audio/mp4'}:{};recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{voiceBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('voicePlayer').src=URL.createObjectURL(voiceBlob);stream.getTracks().forEach(t=>t.stop())};recorder.start();$('start').disabled=true;$('stop').disabled=false;$('musicPlayer').currentTime=0;if(musicFile)$('musicPlayer').play().catch(()=>{});}catch(e){alert(e.message)}};
$('stop').onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop();$('musicPlayer').pause();$('start').disabled=false;$('stop').disabled=true};
async function mix(){if(!musicFile||!voiceBlob)throw Error(T[locale].need);const ac=new (window.AudioContext||window.webkitAudioContext)();try{const [mb,vb]=await Promise.all([musicFile.arrayBuffer(),voiceBlob.arrayBuffer()]);const [m,v]=await Promise.all([ac.decodeAudioData(mb),ac.decodeAudioData(vb)]);const sr=44100;const len=Math.ceil(Math.max(m.duration,v.duration/Number($('voicePreset').value)+0.5)*sr);const off=new OfflineAudioContext(2,len,sr);function source(buffer,gain){const s=off.createBufferSource();s.buffer=buffer;const g=off.createGain();g.gain.value=gain;s.connect(g);g.connect(off.destination);s.start();return {s,g}}source(m,Number($('musicVolume').value));const vocal=source(v,Number($('voiceVolume').value));vocal.s.playbackRate.value=Number($('voicePreset').value);const amount=Number($('echo').value);if(amount){const delay=off.createDelay(1);delay.delayTime.value=.23;const feedback=off.createGain();feedback.gain.value=Math.min(.6,amount);const wet=off.createGain();wet.gain.value=amount;vocal.s.connect(delay);delay.connect(wet);wet.connect(off.destination);delay.connect(feedback);feedback.connect(delay)}return await off.startRendering()}finally{await ac.close()}}
function wav(buffer){const n=buffer.length,ch=2,bytes=44+n*ch*2;const ab=new ArrayBuffer(bytes),dv=new DataView(ab);let p=0;function str(s){for(let i=0;i<s.length;i++)dv.setUint8(p++,s.charCodeAt(i))}function u32(v){dv.setUint32(p,v,true);p+=4}function u16(v){dv.setUint16(p,v,true);p+=2}str('RIFF');u32(bytes-8);str('WAVEfmt ');u32(16);u16(1);u16(ch);u32(buffer.sampleRate);u32(buffer.sampleRate*ch*2);u16(ch*2);u16(16);str('data');u32(bytes-44);const a=buffer.getChannelData(0),b=buffer.getChannelData(1);for(let i=0;i<n;i++)for(const x of [a[i],b[i]]){const z=Math.max(-1,Math.min(1,x));dv.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
let previewUrl=null;$('preview').onclick=async()=>{try{$('preview').disabled=true;const blob=wav(await mix());if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(blob);const a=$('voicePlayer');a.src=previewUrl;await a.play()}catch(e){alert(e.message)}finally{$('preview').disabled=false}};$('endPreview').onclick=()=>{$('voicePlayer').pause()};$('export').onclick=async()=>{try{$('export').disabled=true;const blob=wav(await mix());const file=new File([blob],'khmer-cover-mix.wav',{type:'audio/wav'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch(e){if(e.name!=='AbortError')alert(e.message)}finally{$('export').disabled=false}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
